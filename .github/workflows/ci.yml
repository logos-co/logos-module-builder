name: CI

# pull_request is unfiltered: stacked PRs (based on other feature branches)
# must run CI too.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - uses: cachix/cachix-action@v15
        with:
          name: logos-co
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'

      - name: Run unit tests
        run: nix build '.#checks.x86_64-linux.default'

      - name: Run QML integration tests
        run: nix build '.#checks.x86_64-linux.qml-integration'

      - name: Run static external library tests
        run: nix build '.#checks.x86_64-linux.static-extlib'

      - name: Run test-framework integration tests
        run: nix build '.#checks.x86_64-linux.test-framework-integration'

  # The dylib-closure validator that standalone apps run exists only on darwin,
  # so the Linux job above cannot reach it.
  darwin-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - uses: cachix/cachix-action@v15
        with:
          name: logos-co
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'

      - name: Run dylib closure check tests
        run: nix build '.#checks.aarch64-darwin.darwin-bundle-check' -L
